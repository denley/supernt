# PLL clocks for hw/plltest (tools/pllpatch.py, notes/pll.md). One line per placeholder clock
# buffer (MISTRAL_CLKBUF instance in the Verilog):
#   <clkbuf instance> <MHz> [pll=FPLL.x.y] [out=Cn] [profile=NAME] [tol=PPM]
# 21.477273 MHz on FPLL.000.000 C0 reproduces the SPC core's SNES master clock exactly.
pll_snes  21.477273  pll=FPLL.000.000  out=C0
